name: Daily card

on:
  schedule:
    - cron: "15 21 * * *"   # every day ~4:15 PM Toronto (winter) / 5:15 PM (summer): NFL + NBA
    - cron: "30 15 * * *"   # every day ~10:30 AM Toronto: NFL only (covers 1 PM, Thanksgiving, Thu/Mon games)
  workflow_dispatch:         # "Run workflow" button to refresh any time

permissions:
  contents: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore downloaded game data
        uses: actions/cache@v4
        with:
          path: ~/.sportsedge/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Build site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TZ: America/Toronto
        run: |
          SPORTS=nfl,nba
          if [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then SPORTS=nfl; fi
          python -m sportsedge site --out docs --config site_config.yaml --sports $SPORTS

      - name: Publish
        run: |
          git config user.name "sportsedge-bot"
          git config user.email "sportsedge-bot@users.noreply.github.com"
          git add -A docs data
          git commit -m "Daily card $(date +%F)" || echo "nothing new"
          git pull --rebase -X theirs || true
          git push
