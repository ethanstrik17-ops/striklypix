[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsedge"
version = "0.1.0"
description = "NHL & NBA player/game projections, trend checks and betting value finder"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.2", "requests>=2.28",
                "PyYAML>=6.0", "tabulate>=0.9", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sportsedge = "sportsedge.cli:main"

[tool.setuptools.packages.find]
include = ["sportsedge*"]
