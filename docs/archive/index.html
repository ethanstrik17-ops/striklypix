 document.open();document.write(new TextDecoder().decode(pt));document.close();}

 return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
